# Semgrep structure checks for roots.py (CodeGrade "Code Structure Test").
#
# Each rule below corresponds to one Positive Match or Negative Match block
# nested inside a Code Structure Test block in CodeGrade AutoTest V2. Copy the
# `pattern`/`patterns` portion of a single rule into a Match Block's template
# (see https://help.codegrade.com/automatic-grading-guides/code-structure-tests-with-semgrep.md).
#
# - PositiveMatch rules (pattern-*-exists, pattern-*-uses-*): the test passes
#   if the pattern IS found.
# - NegativeMatch rules (pattern-*-forbids-*): the test passes if the pattern
#   is NOT found.
#
# The `*-forbids-hardcoded-return` rules are also NegativeMatch rules: they
# flag a `return` statement whose value is a bare numeric literal (or a
# tuple of bare numeric literals), which is how a student could fake the
# answer to a public test (e.g. `return 2.0`) instead of computing it from
# the function's arguments.
rules:
